[package]
name = "s-nib"
version = "0.5.3"
description = "WYSIWYG Markdown editor"
authors = ["signo"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "s_nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: child webviews (integrated browser)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.56.0", default-features = false }
base64 = "0.23.1"
percent-encoding = "2.3.2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
tauri-plugin-http = "2.8.3"
tauri-plugin-opener = "2.7.2"
portable-pty = "0.9.0"
arboard = { version = "3", default-features = false }
# Optional database connector (see the `db` feature)
mysql = { version = "28.0.4", features = ["rustls-tls"], optional = true }
keyring = { version = "4.2.0", optional = true }
toml = { version = "1.1.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"], optional = true }

[features]
# Off by default: release builds do not include the database connector
db = ["dep:mysql", "dep:keyring", "dep:toml"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
# same version as webkit2gtk: the browser cell is placed with a GtkOverlay
gtk = "0.18"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

# Typst is slow in debug builds: optimize only the engine dependencies
[profile.dev.package.typst]
opt-level = 2
[profile.dev.package.typst-library]
opt-level = 2
[profile.dev.package.typst-layout]
opt-level = 2
[profile.dev.package.typst-realize]
opt-level = 2
[profile.dev.package.typst-eval]
opt-level = 2
[profile.dev.package.typst-pdf]
opt-level = 2
[profile.dev.package.typst-syntax]
opt-level = 2
[profile.dev.package.comemo]
opt-level = 2
