<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>s-nib</title>
    <link rel="stylesheet" href="/src/themes.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <button type="button" data-action="new" title="Nuovo (Ctrl+N)" aria-label="Nuovo">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg>
      </button>
      <button type="button" data-action="open" title="Apri file (Ctrl+O)" aria-label="Apri file">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
      </button>
      <button type="button" data-action="open_folder" title="Apri cartella (Ctrl+Shift+O)" aria-label="Apri cartella">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button type="button" data-action="save" title="Salva (Ctrl+S)" aria-label="Salva">
        <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3"/><path d="M7 21v-7h10v7"/></svg>
      </button>
      <span class="sep"></span>
      <button type="button" data-action="toggle_sidebar" title="Barra laterale (Ctrl+Shift+L)" aria-label="Barra laterale">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button type="button" data-action="source" title="Modalità sorgente (Ctrl+/)" aria-label="Modalità sorgente">
        <svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>
      </button>
      <div id="theme-picker">
        <button type="button" id="theme-button" aria-haspopup="listbox" aria-expanded="false" title="Tema">Automatico</button>
        <ul id="theme-list" role="listbox" hidden>
          <li><button type="button" role="option" data-theme-value="auto">Automatico</button></li>
          <li><button type="button" role="option" data-theme-value="github">GitHub</button></li>
          <li><button type="button" role="option" data-theme-value="newsprint">Newsprint</button></li>
          <li><button type="button" role="option" data-theme-value="night">Night</button></li>
          <li><button type="button" role="option" data-theme-value="slate">Slate</button></li>
        </ul>
      </div>
    </header>
    <div id="app">
      <aside id="sidebar">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="files">File</button>
          <button type="button" class="tab" data-tab="outline">Struttura</button>
        </div>
        <section id="panel-files" class="panel">
          <div id="folder-bar">
            <button type="button" id="folder-name" aria-haspopup="true" aria-expanded="false" title="Cartelle recenti">Nessuna cartella</button>
            <ul id="recent-menu" hidden></ul>
          </div>
          <ul id="tree" class="tree">
            <li class="empty">Nessuna cartella aperta</li>
          </ul>
        </section>
        <section id="panel-outline" class="panel" hidden>
          <ul id="outline" class="outline"></ul>
        </section>
      </aside>
      <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Ridimensiona barra laterale" tabindex="0"></div>
      <main id="scroller">
        <div id="editor"></div>
        <textarea id="source" hidden spellcheck="false" aria-label="Sorgente Markdown"></textarea>
      </main>
    </div>
  </body>
</html>
